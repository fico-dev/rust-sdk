name: release
run-name: Release by @${{ github.actor }} from ${{ github.ref_name }}
# Starts when a push changes Cargo.toml, where the version is set. The `check`
# job stops the run unless the version is new.
on:
  push:
    branches: ["**"]
    paths: [Cargo.toml]

permissions:
  contents: read

# Runs one at a time per branch and never cancels a run: a cancelled run could
# stop after crates.io has the version, but before the tag exists.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Each job first starts harden-runner, as in ci.yml. It blocks outbound
# connections to any host outside the job's `allowed-endpoints`.
jobs:
  # Decides whether to release the version in Cargo.toml. A stable version,
  # such as `0.2.0`, is released from main, and a pre-release, such as
  # `0.2.0-rc.1`, from any other branch. Either is released only while its
  # `v<version>` tag doesn't exist.
  check:
    name: rust-sdk / check release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      needed: ${{ steps.decide.outputs.needed }}
      prerelease: ${{ steps.decide.outputs.prerelease }}
      tag: ${{ steps.decide.outputs.tag }}
    steps:
      - name: harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: block
          disable-sudo-and-containers: true
          allowed-endpoints: >
            github.com:443
            static.rust-lang.org:443

      - name: git clone
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: install rust
        run: rustup toolchain install

      - name: decide whether to release
        id: decide
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          # Semver marks a pre-release with a `-` before any build metadata.
          if [[ ${version%%+*} == *-* ]]; then prerelease=true; else prerelease=false; fi

          needed=false
          if [ "$prerelease" = true ] && [ "$GITHUB_REF_NAME" = main ]; then
            echo "Pre-releases aren't released from main."
          elif [ "$prerelease" = false ] && [ "$GITHUB_REF_NAME" != main ]; then
            echo "Stable versions are only released from main."
          elif git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            echo "v$version is already released."
          else
            needed=true
          fi

          {
            echo "needed=$needed"
            echo "prerelease=$prerelease"
            echo "tag=v$version"
          } >> "$GITHUB_OUTPUT"

  # Builds the crate from its packaged files, as `cargo publish` would before
  # uploading. It runs in its own job, with no token, because the build runs
  # the dependencies' build scripts and macros, and any of them could read a
  # token in the job and publish with it.
  package:
    name: rust-sdk / package
    needs: check
    if: needs.check.outputs.needed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: block
          disable-sudo-and-containers: true
          allowed-endpoints: >
            github.com:443
            index.crates.io:443
            static.crates.io:443
            static.rust-lang.org:443

      - name: git clone
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: install rust
        run: rustup toolchain install

      - name: build the packaged crate
        run: cargo package --locked

  # Publishes the version to crates.io with trusted publishing. crates.io only
  # trusts this workflow in two environments, whose rules live in GitHub's
  # settings, where a branch's copy of this file can't change them:
  # - `release`, for stable versions, which only main may use. It needs no
  #   approval: a PR reaches main only once someone else approves it.
  # - `prerelease`, for pre-releases, which any branch may use. A member of
  #   @fico-dev/dev other than the pusher must approve the job, since no one
  #   else has reviewed the branch's code.
  publish:
    name: rust-sdk / publish
    needs: [check, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: ${{ needs.check.outputs.prerelease == 'true' && 'prerelease' || 'release' }}
      url: https://crates.io/crates/fico-sdk
    permissions:
      contents: read
      id-token: write # for the OIDC token that crates.io trades for a publish token
    steps:
      # The job reaches crates.io to get and revoke the token and to upload the
      # crate, and its index to package it. harden-runner always allows the
      # GitHub host that hands out the OIDC token.
      - name: harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: block
          disable-sudo-and-containers: true
          allowed-endpoints: >
            crates.io:443
            github.com:443
            index.crates.io:443
            static.rust-lang.org:443

      - name: git clone
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: install rust
        run: rustup toolchain install

      # The action's post step revokes the token when the job ends.
      - name: get a crates.io token
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6

      # `--no-verify` skips the build the `package` job ran, so no dependency's
      # code runs while the token exists. Packaging only reads files and the
      # index.
      - name: publish to crates.io
        run: cargo publish --locked --no-verify
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  # Tags the commit and creates its GitHub release, once crates.io has the
  # version, so a tag always names a published version.
  github-release:
    name: rust-sdk / github release
    needs: [check, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # to create the tag and the release
    steps:
      - name: harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: block
          disable-sudo-and-containers: true
          allowed-endpoints: >
            api.github.com:443

      # A stable release's notes cover every change since the last stable
      # release, its pre-releases included.
      - name: create the release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.check.outputs.prerelease }}
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          flags=()
          if [ "$PRERELEASE" = true ]; then
            flags+=(--prerelease)
          else
            last=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName // empty')
            if [ -n "$last" ]; then flags+=(--notes-start-tag "$last"); fi
          fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$TAG" --generate-notes "${flags[@]}"
